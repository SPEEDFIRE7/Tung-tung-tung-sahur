name: Build super.img (Virtual A/B, Python)

on:
  workflow_dispatch:
    inputs:
      pixeldrain_url:
        description: 'PixelDrain link or file ID (https://pixeldrain.com/u/XXXXXXXX)'
        required: true
        type: string
      super_size:
        description: 'Super partition size in bytes'
        required: true
        default: '5905580032'
        type: string
      group_name:
        description: 'Dynamic partitions group name'
        required: true
        default: 'main'
        type: string
      group_size:
        description: 'Group max size in bytes (empty = super_size - 4MiB)'
        required: false
        default: ''
        type: string
      sparse:
        description: 'Output sparse super.img'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PD_URL: ${{ inputs.pixeldrain_url }}
      SUPER_SIZE: ${{ inputs.super_size }}
      GROUP: ${{ inputs.group_name }}
      GROUP_SIZE: ${{ inputs.group_size }}
      SPARSE: ${{ inputs.sparse }}
      PARTS: "system system_ext product odm vendor vendor_dlkm"
      GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd unzip curl xxd jq python3 android-sdk-libsparse-utils

      - name: Download flashable zip from PixelDrain
        run: |
          ID="${PD_URL##*/}"
          ID="${ID%%\?*}"
          echo "PixelDrain ID: $ID"
          curl -L --fail --retry 3 -o rom.zip "https://pixeldrain.com/api/file/${ID}?download"
          ls -lh rom.zip

      - name: Extract zip
        run: |
          mkdir -p rom
          unzip -q rom.zip -d rom
          rm -f rom.zip

      - name: Decompress partition images
        run: |
          mkdir -p img
          for p in $PARTS; do
            f=$(find rom -type f -name "${p}.img.zst" | head -n 1)
            if [ -n "$f" ]; then
              echo "==> $p (zst)"
              zstd -d -f -T0 "$f" -o "img/${p}.img"
              rm -f "$f"
            else
              f=$(find rom -type f -name "${p}.img" | head -n 1)
              if [ -n "$f" ]; then
                echo "==> $p (img)"
                mv "$f" "img/${p}.img"
              else
                echo "::warning::Partition $p introuvable, ignorée"
                continue
              fi
            fi
            # Le script exige des images brutes : on retire le format sparse
            if [ "$(head -c4 "img/${p}.img" | xxd -p)" = "3aff26ed" ]; then
              echo "    sparse -> raw"
              simg2img "img/${p}.img" "img/${p}.raw"
              mv "img/${p}.raw" "img/${p}.img"
            fi
          done
          rm -rf rom
          df -h /

      - name: Build super.img with Python
        run: |
          chmod +x tools/build_super.py
          SPARSE_FLAG=""
          if [ "${SPARSE,,}" = "true" ]; then SPARSE_FLAG="--sparse"; fi
          EXTRA=""
          if [ -n "$GROUP_SIZE" ]; then EXTRA="--group-size $GROUP_SIZE"; fi
          python3 tools/build_super.py \
            --img-dir img \
            --parts $PARTS \
            --out super.img \
            --super-size "$SUPER_SIZE" \
            --group "$GROUP" \
            --metadata-size 65536 \
            --slots 3 \
            $EXTRA $SPARSE_FLAG
          # Libère l'espace avant la compression
          rm -rf img
          ls -lh super.img
          df -h /

      - name: Compress super.img (zstd)
        run: |
          zstd -T0 -19 -f super.img -o super.img.zst
          rm -f super.img
          ls -lh super.img.zst

      - name: Upload to GoFile
        id: gofile
        run: |
          set -e
          TOKEN_ARG=()
          if [ -n "$GOFILE_TOKEN" ]; then TOKEN_ARG=(-F "token=$GOFILE_TOKEN"); fi

          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESP=$(curl -s --retry 3 "${TOKEN_ARG[@]}" -F "file=@super.img.zst" \
                 "https://${SERVER}.gofile.io/contents/uploadfile" || true)
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)

          if [ -z "$LINK" ]; then
            echo "Premier essai échoué, second endpoint..."
            RESP=$(curl -s --retry 3 "${TOKEN_ARG[@]}" -F "file=@super.img.zst" \
                   "https://upload.gofile.io/uploadfile")
            LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          fi

          if [ -z "$LINK" ]; then
            echo "::error::Échec de l'upload GoFile. Réponse: $RESP"
            exit 1
          fi
          echo "link=$LINK" >> "$GITHUB_OUTPUT"
          echo "### super.img compressé : $LINK" >> "$GITHUB_STEP_SUMMARY"
          echo "Lien GoFile : $LINK"
