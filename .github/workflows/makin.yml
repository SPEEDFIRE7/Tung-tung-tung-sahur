name: Build super.img (Virtual A/B)

on:
  workflow_dispatch:
    inputs:
      pixeldrain_url:
        description: 'PixelDrain link or file ID (https://pixeldrain.com/u/XXXXXXXX)'
        required: true
        type: string
      super_size:
        description: 'Super partition size in bytes (check your device: blockdev --getsize64 /dev/block/by-name/super)'
        required: true
        default: '5905580032'
        type: string
      group_name:
        description: 'Dynamic partitions group name (groups become <name>_a / <name>_b)'
        required: true
        default: 'main'
        type: string
      group_size:
        description: 'Group max size in bytes (empty = super_size - 4MiB)'
        required: false
        default: ''
        type: string
      sparse:
        description: 'Output sparse super.img'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PD_URL: ${{ inputs.pixeldrain_url }}
      SUPER_SIZE: ${{ inputs.super_size }}
      GROUP: ${{ inputs.group_name }}
      GROUP_SIZE: ${{ inputs.group_size }}
      SPARSE: ${{ inputs.sparse }}
      PARTS: "system system_ext product odm vendor vendor_dlkm"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd unzip curl xxd jq android-sdk-libsparse-utils \
            build-essential cmake perl golang-go ninja-build \
            libusb-1.0-0-dev libpcre2-dev libgtest-dev libprotobuf-dev protobuf-compiler \
            libbrotli-dev libzstd-dev liblz4-dev

      - name: Restore cached lpmake
        id: lpcache
        uses: actions/cache@v4
        with:
          path: lpmake-bin
          key: lpmake-nmeum-android-tools-v1

      - name: Build lpmake from source (nmeum/android-tools)
        if: steps.lpcache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Latest release tarball (vendored deps already included)
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/nmeum/android-tools/releases/latest \
            | jq -r '[.assets[].browser_download_url | select(test("android-tools-.*\\.tar\\.(xz|gz)$"))][0]')
          echo "Source tarball: $URL"
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::Release tarball not found"; exit 1; }

          mkdir -p /tmp/at && curl -L --fail -o /tmp/at.tar "$URL"
          tar -xf /tmp/at.tar -C /tmp/at --strip-components=1

          cd /tmp/at
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja -j"$(nproc)" lpmake || ninja -j"$(nproc)"

          BIN=$(find . -type f -name lpmake | head -n 1)
          [ -n "$BIN" ] || { echo "::error::lpmake binary not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/lpmake-bin"
          cp "$BIN" "$GITHUB_WORKSPACE/lpmake-bin/lpmake"

      - name: Prepare lpmake
        run: |
          if [ -f tools/lpmake ]; then
            echo "Using tools/lpmake from the repo"
            cp tools/lpmake ./lpmake
          else
            cp lpmake-bin/lpmake ./lpmake
          fi
          chmod +x lpmake
          ./lpmake --help 2>&1 | head -n 5 || true

      - name: Download flashable zip from PixelDrain
        run: |
          ID="${PD_URL##*/}"
          ID="${ID%%\?*}"
          echo "PixelDrain ID: $ID"
          curl -L --fail --retry 3 -o rom.zip "https://pixeldrain.com/api/file/${ID}?download"
          ls -lh rom.zip

      - name: Extract zip
        run: |
          mkdir -p rom
          unzip -q rom.zip -d rom
          rm -f rom.zip
          find rom -type f | head -n 100

      - name: Decompress partition images (.img.zst)
        run: |
          mkdir -p img
          for p in $PARTS; do
            f=$(find rom -type f -name "${p}.img.zst" | head -n 1)
            if [ -n "$f" ]; then
              echo "==> $p  ($f)"
              zstd -d -f -T0 "$f" -o "img/${p}.img"
              rm -f "$f"
            else
              f=$(find rom -type f -name "${p}.img" | head -n 1)
              if [ -n "$f" ]; then
                echo "==> $p  ($f, already .img)"
                mv "$f" "img/${p}.img"
              else
                echo "::warning::Partition $p not found in zip, skipped"
                continue
              fi
            fi
            # un-sparse if needed (lpmake needs raw images)
            if [ "$(head -c4 "img/${p}.img" | xxd -p)" = "3aff26ed" ]; then
              echo "    sparse image -> raw"
              simg2img "img/${p}.img" "img/${p}.raw"
              mv "img/${p}.raw" "img/${p}.img"
            fi
          done
          rm -rf rom
          ls -lh img
          df -h /

      - name: Build super.img (Virtual A/B)
        run: |
          mkdir -p out
          if [ -z "$GROUP_SIZE" ]; then
            GROUP_SIZE=$(( SUPER_SIZE - 4194304 ))
          fi

          TOTAL=0
          for p in $PARTS; do
            [ -f "img/${p}.img" ] && TOTAL=$(( TOTAL + $(stat -c%s "img/${p}.img") ))
          done
          echo "Total partitions size: $TOTAL"
          echo "Group max size:        $GROUP_SIZE"
          if [ "$TOTAL" -gt "$GROUP_SIZE" ]; then
            echo "::error::Images ($TOTAL) exceed group size ($GROUP_SIZE). Increase super_size/group_size."
            exit 1
          fi

          ARGS=(
            --metadata-size 65536
            --super-name super
            --metadata-slots 3
            --device-size "$SUPER_SIZE"
            --virtual-ab
            --group "${GROUP}_a:${GROUP_SIZE}"
            --group "${GROUP}_b:${GROUP_SIZE}"
          )

          for p in $PARTS; do
            [ -f "img/${p}.img" ] || continue
            s=$(stat -c%s "img/${p}.img")
            ARGS+=( --partition "${p}_a:readonly:${s}:${GROUP}_a" --image "${p}_a=img/${p}.img" )
            ARGS+=( --partition "${p}_b:readonly:0:${GROUP}_b" )
          done

          if [ "$SPARSE" = "true" ]; then
            ARGS+=( --sparse )
          fi
          ARGS+=( --output out/super.img )

          ./lpmake "${ARGS[@]}"
          ls -lh out/

      - name: Upload super.img
        uses: actions/upload-artifact@v4
        with:
          name: super-img
          path: out/super.img
          compression-level: 0
          retention-days: 7
